name: Feature request
description: Something Skylight could do.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What you're trying to do
      description: The problem or the moment it would help, more than the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What you'd like
      description: How it could work. Mention it if a package or an agent tool could do it instead.
  - type: textarea
    id: elsewhere
    attributes:
      label: Elsewhere
      description: How Safari, Arc, Chrome or another app does it, if one does.
