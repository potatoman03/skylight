name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Tests
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: swift --version
      - name: Build the tests
        run: swift build --product SkylightPackageTests
      - name: Run the tests
        run: swift test --skip-build

  app:
    name: App bundle
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build everything
        run: swift build
      - name: Bundle (ad hoc signed)
        run: scripts/bundle.sh
      - name: Check the bundle's signature
        run: codesign --verify --deep --strict build/Skylight.app
