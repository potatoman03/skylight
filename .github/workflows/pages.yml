name: Website

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
      - "scripts/prepare-update-feed.py"
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      test_release_trigger:
        description: Test the release-triggered deployment
        type: boolean
        default: false

concurrency:
  group: pages-${{ (github.event_name == 'release' || inputs.test_release_trigger) && 'trigger' || 'deploy' }}
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  refresh:
    name: Refresh after a release
    if: github.event_name == 'release' || inputs.test_release_trigger
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Start deployment from main
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main
  deploy:
    name: Deploy
    if: github.event_name != 'release' && !inputs.test_release_trigger
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Include the latest signed update
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p update-download public
          cp -R site/. public/
          tag="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)"
          version="${tag#v}"
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --dir update-download \
            --pattern appcast.xml --pattern "Skylight-${version}.zip"
          python3 scripts/prepare-update-feed.py update-download/appcast.xml \
            "update-download/Skylight-${version}.zip" public
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deploy
        uses: actions/deploy-pages@v4
